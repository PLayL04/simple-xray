name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Before build/test: tests validate generated configs with the real xray.exe.
      - name: Fetch Xray core and geo files
        shell: pwsh
        run: ./tools/fetch-xray.ps1

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release

      - name: Publish (win-x64, self-contained)
        run: dotnet publish src/SimpleXray.Desktop -c Release -r win-x64 --self-contained -o publish/SimpleXray

      - name: Pack portable zip
        shell: pwsh
        run: ./tools/make-zip.ps1 -SkipPublish

      - uses: actions/upload-artifact@v7
        with:
          name: SimpleXray-win-x64
          path: publish/SimpleXray-*-win-x64.zip
          if-no-files-found: error
